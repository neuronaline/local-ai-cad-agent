<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local AI CAD Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/highlight/styles/github-dark.min.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel">
        <header class="panel-header">
          <div class="brand"><a href="/" class="back-link" title="Back to projects">← Projects</a><h1>{{ project_name }}</h1><span id="connection-status" class="connection-status" title="Connecting…"></span></div>
        </header>
        <div id="chat-feed" class="chat-feed" aria-live="polite">
          <div class="empty-state">
            <strong>Project: {{ project_name }}</strong>
            <span>Describe the part you want to build.</span>
            <div class="example-prompts">
              <span class="example-label">Try an example:</span>
              <button type="button" class="example-prompt" data-prompt="Create a 60 × 30 × 4 mm mounting plate with four M3 holes.">Create a 60 × 30 × 4 mm mounting plate with four M3 holes.</button>
              <button type="button" class="example-prompt" data-prompt="Create a wheel for a 6 mm D-shaped motor shaft.">Create a wheel for a 6 mm D-shaped motor shaft.</button>
              <button type="button" class="example-prompt" data-prompt="Create a 40 mm cube with a centered 20 mm circular hole.">Create a 40 mm cube with a centered 20 mm circular hole.</button>
            </div>
          </div>
        </div>
        <div id="question-area"></div>
        <form id="chat-form" class="composer">
          <textarea id="message" placeholder="Describe the part you want to create…" rows="2" required></textarea>
          <div class="action-bar">
            <label id="dropzone" class="attach-button" for="attachments" title="Add reference images"><span aria-hidden="true">＋</span><span id="attachment-label">Attach</span><input id="attachments" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></label>
            <button id="history-btn" type="button" class="quiet">History</button>
            <button id="stop" type="button" class="danger" hidden>Stop</button>
            <button type="submit">Send</button>
          </div>
        </form>
      </section>
      <section class="viewer-panel">
        <header class="viewer-toolbar"><div class="viewer-title"><h2>Preview</h2><span id="dimensions">No preview yet</span></div><div class="viewer-actions"><button id="toggle-wireframe" class="quiet">Wireframe</button><button id="toggle-grid" class="quiet">Grid</button><button id="reset-view" class="quiet">Reset</button></div></header>
        <div id="viewer" class="viewer"><div id="viewer-empty" class="viewer-empty"><span class="preview-icon">◇</span><strong>No preview yet</strong></div></div>
        <section class="render-section" id="render-section" hidden>
          <header class="render-header">
            <h3>Render</h3>
            <button id="render-toggle" type="button" class="quiet" aria-expanded="false">Show</button>
          </header>
          <div id="render-body" class="render-body" hidden>
            <img id="render-image" alt="Latest render of the current model" loading="lazy">
          </div>
        </section>
      </section>
    </main>
    <aside id="history-drawer" class="history-drawer" hidden>
      <header class="drawer-header">
        <h2>History</h2>
        <button id="history-close" type="button" class="quiet">✕</button>
      </header>
      <nav class="drawer-tabs">
        <button id="history-tab" type="button" class="drawer-tab" aria-pressed="true">Conversation</button>
        <button id="model-tab" type="button" class="drawer-tab" aria-pressed="false">Model</button>
      </nav>
      <div id="history-content" class="drawer-content"></div>
      <div id="model-content" class="drawer-content" hidden></div>
    </aside>
    <script>
      window.APP_CONFIG = {
        projectName: {{ project_name | tojson }},
        showInfoMessages: {{ show_info_messages | tojson }},
      };
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "{{ url_for('static', filename='vendor/three/three.module.js') }}",
          "three/addons/": "{{ url_for('static', filename='vendor/three/addons/') }}"
        }
      }
    </script>
    <script src="{{ url_for('static', filename='vendor/marked/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/highlight/highlight.min.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
