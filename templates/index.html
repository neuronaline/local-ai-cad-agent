<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local AI CAD Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ cache_bust }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/highlight/styles/github-dark.min.css') }}">
  </head>
  <body data-mobile-view="chat">
    <nav class="mobile-tabs" aria-label="Workspace">
      <button type="button" data-mobile-view="chat" aria-pressed="true">Chat</button>
      <button type="button" data-mobile-view="viewer" aria-pressed="false">Preview</button>
    </nav>
    <main class="app-shell">
      <section class="chat-panel">
        <header class="panel-header">
          <div class="brand">
            <a href="/" class="back-link" title="Back to projects">← Projects</a>
            <h1>{{ project_name }}</h1>
            <span id="connection-status" class="connection-status" role="status" aria-label="Connecting" title="Connecting…"></span>
          </div>
        </header>
        <div id="busy-project-banner" class="busy-project-banner" hidden></div>
        <div id="chat-feed" class="chat-feed" aria-live="polite"></div>
        <template id="chat-empty">
          <div class="empty-state">
            <strong>{{ project_name }}</strong>
            <span>Describe the part you want to build.</span>
            <div class="example-prompts">
              <span class="example-label">Examples</span>
              {% for item in example_prompts or [] %}
              <button type="button" class="example-prompt" data-prompt="{{ item.prompt }}">{{ item.title }}</button>
              {% endfor %}
            </div>
          </div>
        </template>
        <div id="question-area"></div>
        <details id="activity-panel" class="activity-panel" hidden>
          <summary>
            <span id="activity-title">Activity</span>
            <span id="usage-pill" class="usage-pill" hidden></span>
            <span class="activity-chevron">⌄</span>
          </summary>
          <div id="activity-list" class="activity-list"></div>
        </details>
        <form id="chat-form" class="composer">
          <div id="slash-popup" class="slash-popup hidden" role="listbox" aria-label="Commands">
            <div class="slash-popup-header">Commands</div>
            <div id="slash-popup-list" class="slash-popup-list"></div>
          </div>
          <textarea id="message" placeholder="Describe the part, dimensions, fit, and required features…" rows="2" required aria-label="Part description"></textarea>
          <div id="attachment-preview" class="attachment-preview" aria-live="polite"></div>
          <div class="action-bar">
            <label id="dropzone" class="attach-button icon-only" for="attachments" title="Add reference images" aria-label="Add reference images">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M20.5 11.6 12.3 19.8a5.4 5.4 0 0 1-7.6-7.6l8.6-8.6a3.6 3.6 0 0 1 5.1 5.1l-8.6 8.6a1.8 1.8 0 0 1-2.5-2.5l7.7-7.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input id="attachments" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
            </label>
            <span id="attachment-label" class="sr-only">Attach reference images</span>
            <span class="composer-hint">Enter sends · Shift+Enter adds a line · / for commands</span>
            <button id="send-toggle" type="button" class="send-toggle" title="Send" aria-label="Send">
              <span class="send-toggle-icon" data-mode="send">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4 12 20 4l-4 16-4-6.5L4 12Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="send-toggle-icon" data-mode="stop" hidden>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                </svg>
              </span>
            </button>
          </div>
        </form>
      </section>
      <div id="panel-resizer" class="panel-resizer" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"></div>
      <section class="viewer-panel">
        <header class="viewer-toolbar">
          <div class="viewer-title">
            <div class="viewer-tabs" role="tablist" aria-label="Viewer modes">
              <button id="view-tab-3d" type="button" class="viewer-tab active" role="tab" aria-selected="true">3D View</button>
              <button id="view-tab-code" type="button" class="viewer-tab" role="tab" aria-selected="false">Code</button>
            </div>
            <span id="dimensions">No preview yet</span>
            <span id="grid-warning" class="grid-warning" hidden title="Model exceeds the configured grid surface"></span>
          </div>
          <div class="viewer-actions" aria-label="Preview controls">
            <button id="build-btn" type="button" class="quiet toolbar-pill" title="Rebuild model from model.scad" aria-label="Rebuild model">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.9 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Build</span>
            </button>
            <button id="toggle-wireframe" type="button" class="quiet toolbar-pill" aria-pressed="false" title="Toggle wireframe" aria-label="Toggle wireframe">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m21 16-9 5-9-5V8l9-5 9 5v8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M12 3v18M3 8l18 8M3 16l18-8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" opacity="0.6"/>
              </svg>
              <span>Wireframe</span>
            </button>
            <button id="toggle-grid" type="button" class="quiet toolbar-pill" aria-pressed="true" title="Toggle grid" aria-label="Toggle grid">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <span>Grid</span>
            </button>
            <button id="history-btn" type="button" class="quiet toolbar-pill" title="Revision history" aria-label="Revision history" aria-expanded="false" aria-controls="history-drawer">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 12a9 9 0 1 0 3.6-7.2M3 4v5h5M12 8v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Revisions</span>
            </button>
            <div class="export-combo" role="group" aria-label="Export model">
              <select id="export-format" class="export-select" title="Export format" aria-label="Export format">
                <option value="stl" selected>STL (.stl)</option>
                <option value="scad">SCAD (.scad)</option>
                <option value="3mf">3MF (.3mf)</option>
                <option value="obj">OBJ (.obj)</option>
                <option value="amf">AMF (.amf)</option>
                <option value="off">OFF (.off)</option>
                <option value="csg">CSG (.csg)</option>
              </select>
              <button id="download-model" type="button" class="download-btn" title="Download model in selected format" aria-label="Download model" disabled>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Export</span>
              </button>
            </div>
          </div>
        </header>
        <div id="viewer" class="viewer">
          <div class="viewer-floating-presets" role="group" aria-label="Standard views">
            <button type="button" class="view-pill active" data-view="iso" title="Isometric view" aria-label="Isometric view" aria-pressed="true">Iso</button>
            <button type="button" class="view-pill" data-view="front" title="Front view" aria-label="Front view" aria-pressed="false">Front</button>
            <button type="button" class="view-pill" data-view="top" title="Top view" aria-label="Top view" aria-pressed="false">Top</button>
            <button type="button" class="view-pill" data-view="right" title="Right view" aria-label="Right view" aria-pressed="false">Right</button>
            <button id="reset-view" type="button" class="view-pill view-pill-fit" title="Fit view" aria-label="Fit view">Fit</button>
          </div>
          <div id="viewer-empty" class="viewer-empty"><span class="preview-icon">◇</span><strong>No preview yet</strong><span>Inspect the model here once it is ready.</span></div>
        </div>
        <div id="code-view" class="code-view" hidden>
          <div class="code-toolbar">
            <div class="code-meta">
              <span class="code-filename">model.scad</span>
              <span id="code-stats" class="code-stats">0 lines</span>
            </div>
            <div class="code-actions">
              <button id="save-code-btn" type="button" class="quiet toolbar-pill code-action-btn" title="Save code (Ctrl+S)" aria-label="Save code">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <polyline points="17 21 17 13 7 13 7 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <polyline points="7 3 7 8 15 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Save</span>
              </button>
              <button id="copy-code-btn" type="button" class="quiet toolbar-pill code-action-btn" title="Copy code" aria-label="Copy code">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <rect x="9" y="9" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Copy</span>
              </button>
            </div>
          </div>
          <textarea id="code-editor" class="code-editor" spellcheck="false" placeholder="// No model.scad found"></textarea>
        </div>
      </section>
    </main>
    <aside id="history-drawer" class="history-drawer" hidden>
      <header class="drawer-header">
        <h2>Revisions</h2>
        <button id="history-close" type="button" class="quiet" title="Close" aria-label="Close">✕</button>
      </header>
      <div id="revisions-content" class="drawer-content"></div>
    </aside>
    <div id="image-preview-modal" class="modal hidden" aria-hidden="true" role="dialog" aria-label="Image preview">
      <div class="image-modal-content">
        <div class="image-modal-header">
          <span id="image-modal-title" class="image-modal-title">Reference Image</span>
          <button id="image-modal-close" type="button" class="quiet icon-only" title="Close" aria-label="Close">✕</button>
        </div>
        <div class="image-modal-body">
          <img id="image-modal-img" src="" alt="Preview">
        </div>
      </div>
    </div>
    <script id="app-config" type="application/json">
      {{ {
        'projectName': project_name,
        'showInfoMessages': show_info_messages,
        'viewerGrid': {
          'size': viewer_grid_size,
          'divisions': viewer_grid_divisions,
        }
      } | tojson }}
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "{{ url_for('static', filename='vendor/three/three.module.js') }}",
          "three/addons/": "{{ url_for('static', filename='vendor/three/addons/') }}"
        }
      }
    </script>
    <script src="{{ url_for('static', filename='vendor/marked/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/highlight/highlight.min.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}?v={{ cache_bust }}"></script>
  </body>
</html>
