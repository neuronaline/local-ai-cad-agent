<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local AI CAD Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/highlight/styles/github-dark.min.css') }}">
  </head>
  <body data-mobile-view="chat">
    <nav class="mobile-tabs" aria-label="Workspace">
      <button type="button" data-mobile-view="chat" aria-pressed="true">Chat</button>
      <button type="button" data-mobile-view="viewer" aria-pressed="false">Preview</button>
    </nav>
    <main class="app-shell">
      <section class="chat-panel">
        <header class="panel-header">
          <div class="brand">
            <a href="/" class="back-link" title="Back to projects">← Projects</a>
            <h1>{{ project_name }}</h1>
            <span id="connection-status" class="connection-status" title="Connecting…"></span>
          </div>
        </header>
        <div id="chat-feed" class="chat-feed" aria-live="polite"></div>
        <template id="chat-empty">
          <div class="empty-state">
            <strong>{{ project_name }}</strong>
            <span>Describe the part you want to build.</span>
            <div class="example-prompts">
              <span class="example-label">Examples</span>
              <button type="button" class="example-prompt" data-prompt="Create a 60 × 30 × 4 mm mounting plate with four 3.2 mm through-holes. Place each hole center 5 mm from its two nearest edges.">Mounting plate with four holes</button>
              <button type="button" class="example-prompt" data-prompt="Create a wheel 50 mm in diameter and 12 mm thick for a 6 mm D-shaped motor shaft. Use a 5.5 mm flat-to-round shaft profile.">Wheel for a 6 mm D shaft</button>
              <button type="button" class="example-prompt" data-prompt="Create a 40 mm cube with a centered 20 mm diameter through-hole along the Z axis.">Cube with a centered through-hole</button>
              <button type="button" class="example-prompt" data-prompt="Create a U-shaped mounting bracket from 4 mm stock: base 90 × 50 mm, two 40 mm-high side walls, 6 mm inside bend radii, and a 30 mm-wide opening. Add four 5.5 mm base mounting holes and one 8 mm horizontal through-hole in each side wall, centered 20 mm above the base.">U bracket with bend radii</button>
              <button type="button" class="example-prompt" data-prompt="Create a 72 mm diameter, 8 mm thick servo horn with a centered 6 mm D-shaped bore (5.5 mm flat-to-round), six 4 mm radial spokes, and six 3 mm linkage holes on a 28 mm bolt circle. Keep a 14 mm solid hub around the bore.">Spoked servo horn</button>
              <button type="button" class="example-prompt" data-prompt="Create a 100 × 60 × 6 mm cable-management tray with 18 mm-high side lips, six 12 × 6 mm rounded cable slots along the centerline, and 3 mm ribs between slots. Add two countersunk M4 mounting holes 10 mm from each short end.">Ribbed cable tray</button>
              <button type="button" class="example-prompt" data-prompt="Create a 48 mm inside-diameter pipe saddle for a 3 mm wall tube. Make the saddle 36 mm wide, add two 8 mm-thick mounting ears extending 18 mm from opposite sides, and put one 6.5 mm vertical through-hole in each ear. Use 2 mm edge fillets where practical.">Pipe saddle with mounting ears</button>
              <button type="button" class="example-prompt" data-prompt="Create a 70 × 45 × 8 mm quick-release camera plate with a centered 35 × 8 mm rounded slot, 30° dovetail rails along both long edges, and a 1/4-20 threaded-hole-sized 6.35 mm through-hole offset 15 mm from one short edge. Preserve at least 4 mm wall thickness around every cut.">Dovetail camera plate</button>
              <button type="button" class="example-prompt" data-prompt="Create a one-piece snap-fit test coupon: a 90 × 30 × 4 mm base with two 45 mm-long cantilever arms, each 8 mm wide and 2.5 mm thick. Add a 2 mm-high retaining hook at each tip and a 0.8 mm relief gap around the arms; use generous root fillets without invalidating the part.">Dual cantilever snap-fit coupon</button>
            </div>
          </div>
        </template>
        <div id="question-area"></div>
        <details id="activity-panel" class="activity-panel" hidden>
          <summary>
            <span id="activity-title">Activity</span>
            <span id="usage-pill" class="usage-pill" hidden></span>
            <span class="activity-chevron">⌄</span>
          </summary>
          <div id="activity-list" class="activity-list"></div>
        </details>
        <form id="chat-form" class="composer">
          <textarea id="message" placeholder="Describe the part, dimensions, fit, and required features…" rows="2" required aria-label="Part description"></textarea>
          <div id="attachment-preview" class="attachment-preview" aria-live="polite"></div>
          <div class="action-bar">
            <label id="dropzone" class="attach-button icon-only" for="attachments" title="Add reference images" aria-label="Add reference images">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M20.5 11.6 12.3 19.8a5.4 5.4 0 0 1-7.6-7.6l8.6-8.6a3.6 3.6 0 0 1 5.1 5.1l-8.6 8.6a1.8 1.8 0 0 1-2.5-2.5l7.7-7.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <input id="attachments" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
            </label>
            <span id="attachment-label" class="sr-only">Attach reference images</span>
            <span class="composer-hint">Enter sends · Shift+Enter adds a line</span>
            <button id="history-btn" type="button" class="quiet icon-only" title="History" aria-label="History">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 12a9 9 0 1 0 3.6-7.2M3 4v5h5M12 8v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button id="reset-context" type="button" class="quiet icon-only" title="Reset context" aria-label="Reset context">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 12a8 8 0 0 1 13.7-5.6M20 4v4h-4M20 12a8 8 0 0 1-13.7 5.6M4 20v-4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button id="send-toggle" type="button" class="send-toggle" title="Send" aria-label="Send">
              <span class="send-toggle-icon" data-mode="send">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4 12 20 4l-4 16-4-6.5L4 12Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="send-toggle-icon" data-mode="stop" hidden>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
                </svg>
              </span>
            </button>
          </div>
        </form>
      </section>
      <div id="panel-resizer" class="panel-resizer" role="separator" aria-orientation="vertical" aria-label="Resize panels"></div>
      <section class="viewer-panel">
        <header class="viewer-toolbar">
          <div class="viewer-title"><h2>Preview</h2><span id="dimensions">No preview yet</span><span id="grid-warning" class="grid-warning" hidden title="Model exceeds the configured grid surface"></span></div>
          <div class="viewer-actions" aria-label="Preview controls">
            <div class="view-presets" role="group" aria-label="Standard views">
              <button type="button" class="quiet icon-only active" data-view="iso" title="Isometric view" aria-label="Isometric view">◈</button>
              <button type="button" class="quiet icon-only" data-view="front" title="Front view" aria-label="Front view">F</button>
              <button type="button" class="quiet icon-only" data-view="top" title="Top view" aria-label="Top view">T</button>
              <button type="button" class="quiet icon-only" data-view="right" title="Right view" aria-label="Right view">R</button>
            </div>
            <button id="toggle-wireframe" class="quiet" aria-pressed="false">Wireframe</button>
            <button id="toggle-grid" class="quiet" aria-pressed="true">Grid</button>
            <button id="reset-view" class="quiet">Fit</button>
          </div>
        </header>
        <div id="viewer" class="viewer"><div id="viewer-empty" class="viewer-empty"><span class="preview-icon">◇</span><strong>No preview yet</strong><span>Inspect the model here once it is ready.</span></div></div>
        <div id="model-actions" class="model-actions" hidden>
          <span>Model ready for review</span>
          <button id="approve-design" type="button">Finalize design</button>
          <button id="continue-editing" type="button" class="quiet">Continue editing</button>
        </div>
        <section class="render-section" id="render-section" hidden>
          <header class="render-header">
            <h3>Render</h3>
            <button id="render-toggle" type="button" class="quiet" aria-expanded="false">Show</button>
          </header>
          <div id="render-body" class="render-body" hidden>
            <img id="render-image" alt="Latest render of the current model" loading="lazy">
          </div>
        </section>
        <section class="review-section" id="review-section" hidden>
          <header class="render-header">
            <h3>Multi-view review</h3>
            <span id="review-status" class="review-status">Idle</span>
          </header>
          <div id="review-summary" class="review-summary" hidden></div>
          <div class="review-gallery" id="review-gallery"></div>
        </section>
      </section>
    </main>
    <aside id="history-drawer" class="history-drawer" hidden>
      <header class="drawer-header">
        <h2>History</h2>
        <button id="history-close" type="button" class="quiet">✕</button>
      </header>
      <nav class="drawer-tabs">
        <button id="history-tab" type="button" class="drawer-tab" aria-pressed="true">Conversation</button>
        <button id="model-tab" type="button" class="drawer-tab" aria-pressed="false">Model</button>
      </nav>
      <div id="history-content" class="drawer-content"></div>
      <div id="model-content" class="drawer-content" hidden></div>
    </aside>
    <script id="app-config" type="application/json">
      {{ {
        'projectName': project_name,
        'showInfoMessages': show_info_messages,
        'viewerGrid': {
          'size': viewer_grid_size,
          'divisions': viewer_grid_divisions,
        }
      } | tojson }}
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "{{ url_for('static', filename='vendor/three/three.module.js') }}",
          "three/addons/": "{{ url_for('static', filename='vendor/three/addons/') }}"
        }
      }
    </script>
    <script src="{{ url_for('static', filename='vendor/marked/marked.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/highlight/highlight.min.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
