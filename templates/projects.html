<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CAD Agent — Projects</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ cache_bust }}">
  </head>
  <body>
    <main class="projects-page">
      <header class="projects-header">
        <div class="brand">
          <span class="brand-logo">◈</span>
          <h1>CAD Agent</h1>
          <span class="projects-badge" id="projects-count"></span>
        </div>
        <div class="projects-header-actions">
          <div class="search-input-wrap">
            <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input id="project-search" type="search" placeholder="Search projects…" aria-label="Search projects" autocomplete="off">
          </div>
          <button id="new-project-btn" class="primary new-btn">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>New Project</span>
          </button>
        </div>
      </header>

      <div id="new-project-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="new-project-title">
        <div class="modal-content">
          <h3 id="new-project-title">New Project</h3>
          <form id="new-project-form">
            <input id="new-project-name" type="text" placeholder="project-name" required
                   pattern="[a-z0-9][a-z0-9-]{0,62}" autocomplete="off">
            <p class="hint">Only lowercase letters, numbers, and hyphens.</p>
            <p id="new-project-error" class="modal-error" hidden></p>
            <div class="modal-actions">
              <button type="button" id="cancel-new-project" class="quiet">Cancel</button>
              <button type="submit">Create</button>
            </div>
          </form>
        </div>
      </div>

      <div id="rename-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="rename-project-title">
        <div class="modal-content">
          <h3 id="rename-project-title">Rename Project</h3>
          <form id="rename-form">
            <input id="rename-name" type="text" placeholder="new-name" required
                   pattern="[a-z0-9][a-z0-9-]{0,62}" autocomplete="off">
            <p class="hint">Only lowercase letters, numbers, and hyphens.</p>
            <p id="rename-error" class="modal-error" hidden></p>
            <div class="modal-actions">
              <button type="button" id="cancel-rename" class="quiet">Cancel</button>
              <button type="submit">Rename</button>
            </div>
          </form>
        </div>
      </div>

      <div id="delete-confirm" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="delete-project-title">
        <div class="modal-content">
          <h3 id="delete-project-title">Delete Project</h3>
          <p>Are you sure you want to delete <strong id="delete-project-name"></strong>? This cannot be undone.</p>
          <p id="delete-error" class="modal-error" hidden></p>
          <div class="modal-actions">
            <button type="button" id="cancel-delete" class="quiet">Cancel</button>
            <button type="button" id="confirm-delete" class="danger">Delete</button>
          </div>
        </div>
      </div>

      <div id="projects-grid" class="projects-grid">
        <div class="empty-projects">
          <div class="empty-icon">◇</div>
          <h2>No projects yet</h2>
          <p>Create your first CAD project to get started.</p>
          <button id="empty-cta" class="primary">Get Started</button>
        </div>
      </div>
    </main>

    <script src="{{ url_for('static', filename='js/projects.js') }}?v={{ cache_bust }}"></script>
  </body>
</html>
