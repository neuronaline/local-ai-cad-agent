# Copy this file to config.yaml and adjust it for your machine.
workspace_root: ~/CAD-Agent-Projects

agent:
  tool_call_limit: 30
  revision_retention_count: 0  # 0 keeps all model revisions
  debug_log_tool_errors: false  # Writes recoverable failures to <project>/debug-errors.jsonl

# LLM provider selection. Set ``provider`` to either ``openrouter`` or
# ``openai``; the matching namespace below supplies its model + endpoint.
# Both namespaces are kept in sync so you can switch providers without
# losing either configuration.
llm:
  provider: openrouter

openrouter:
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-3.6-flash
  timeout_seconds: 60
  app_title: Local AI CAD Agent
  app_url: ""
  session_prefix: local-ai-cad-agent
  reasoning_effort: "medium"
  provider: "google-vertex/global"
  force_provider: true
  enable_anthropic_cache: true
  enable_gemini_cache: true

openai:
  base_url: https://api.openai.com/v1
  model: gpt-5.6-terra
  timeout_seconds: 60
  reasoning_effort: ""

server:
  host: 127.0.0.1
  port: 5000

ui:
  show_info_messages: true

# Post-build review gate. When enabled, every successful cad_build_and_verify
# must also pass a bounded multi-view visual review before the agent reports
# completion. max_cycles caps the number of repair attempts per user task.
review:
  enabled: true
  max_cycles: 3
  render_workers: 4
  required_views: 8
