# Copy this file to config.yaml and adjust it for your machine.
workspace_root: ~/CAD-Agent-Projects

# ── 1. Active LLM Provider ───────────────────────────────────────────────────
# Supported providers: openrouter | gemini (aistudio) | vertex | openai | ollama
# Set either a provider name ("openrouter") or "<provider>:<model>"
# ("gemini:gemini-3.8-flash"). If only a provider name is given, the first
# model listed under that provider below is used as its default.
llm:
  provider: openrouter
  # Optional backup provider (same forms as `provider`, e.g. "vertex"), used
  # once if the primary fails after its own retries. Must differ from provider.
  fallback_provider: ""
  max_completion_tokens: 65536

# ── 2. Providers & Per-Model Settings ────────────────────────────────────────
# Each provider groups its own connection settings and models in one place.
# Every model can define its own `reasoning_effort` ("" | minimal | low | medium | high).
# Models configured below appear automatically in the Web UI model picker.
# Optional provider keys (shown values are defaults where applicable):
#   all:        base_url, timeout_seconds, reasoning_effort (default for its models)
#   openrouter: provider_order: [], force_provider: false, reasoning_max_tokens: 0
#               (defaults for its models), app_title, app_url, session_prefix,
#               enable_anthropic_cache: true, enable_gemini_cache: true
#   gemini:     store: true, project_id / location (auth_mode: gcloud only)

openrouter:
  # In OpenRouter, each model is hosted by different upstream sub-providers.
  # You can bind `providers` (priority routing order), `force_provider`, and
  # `reasoning_effort` directly per model so switching models in the UI
  # automatically switches the OpenRouter sub-providers too:
  models: {}
    # deepseek/deepseek-r1:
    #   reasoning_effort: high
    #   providers: [novita/fp8, deepinfra/fp4]
    #   force_provider: false
    # z-ai/glm-5:
    #   reasoning_effort: medium
    #   providers: [z-ai/fp8]

gemini:
  auth_mode: api_key            # api_key (GEMINI_API_KEY in .env) | gcloud
  models:
    gemini-3.8-flash:
      reasoning_effort: ""
    gemini-3.8-pro:
      reasoning_effort: ""

vertex:
  project_id: ""                # Auto-detected from gcloud / GCP_PROJECT if blank
  location: us-central1
  models:
    gemini-3.8-flash:
      reasoning_effort: ""
    gemini-3.8-pro:
      reasoning_effort: ""

ollama:
  base_url: http://localhost:11434/v1
  models:
    qwen3.8:27b:
      reasoning_effort: ""

openai:
  models: {}
    # gpt-5:
    #   reasoning_effort: medium

# ── 3. Agent, Server & Viewport ──────────────────────────────────────────────
agent:
  tool_call_limit: 25
  revision_retention_count: 0   # 0 keeps all model revisions
  # off | errors (<project>/debug-errors.jsonl) | debug (rolling activity.jsonl)
  # | dataset (untrimmed trajectories/<run_id>.jsonl)
  log_mode: off

server:
  host: 127.0.0.1
  port: 8000

ui:
  show_info_messages: true

viewer:
  grid:
    size: 200                   # Square ground grid in mm (X and Z)
    divisions: 20

review:
  render_workers: 4
  required_views: 8
