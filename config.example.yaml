# Copy this file to config.yaml and adjust it for your machine.
workspace_root: ~/CAD-Agent-Projects

agent:
  tool_call_limit: 30
  revision_retention_count: 0  # 0 keeps all model revisions
  debug_log_tool_errors: false  # Writes recoverable failures to <project>/debug-errors.jsonl
  log_tool_activity: false  # Writes raw tool-loop trace to <project>/.cad-agent/activity.jsonl

# LLM provider selection. Set ``provider`` to either ``openrouter`` or
# ``openai``; the matching namespace below supplies its model + endpoint.
# Both namespaces are kept in sync so you can switch providers without
# losing either configuration.
llm:
  provider: openrouter
  max_completion_tokens: 8192

openrouter:
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-3.6-flash
  timeout_seconds: 60
  app_title: Local AI CAD Agent
  app_url: ""
  session_prefix: local-ai-cad-agent
  reasoning_effort: "medium"
  provider: "google-vertex/global"
  force_provider: true
  enable_anthropic_cache: true
  enable_gemini_cache: true

openai:
  base_url: https://api.openai.com/v1
  model: gpt-5.6-terra
  timeout_seconds: 60
  reasoning_effort: ""

server:
  host: 127.0.0.1
  port: 5000

ui:
  show_info_messages: true

# Review rendering settings. ``review.enabled`` controls whether
# cad_build_and_verify rasterises the canonical eight views + contact sheet
# (default true). The structured verdict (cad_review) is opt-in by the agent
# and never auto-toggles on this flag.
review:
  enabled: true
  render_workers: 4
  required_views: 8

# 3D preview viewer settings. ``viewer.grid`` controls the ground grid in
# the Three.js preview viewport. ``size`` is a single dimension in mm that
# is used for both X and Z (the grid is square); ``divisions`` is the cell
# count per side. You can also pass the keys explicitly:
#   viewer:
#     grid:
#       size: 256
#       divisions: 256
# Models whose bounding box exceeds the configured grid surface will show
# a warning in the preview header.
viewer:
  grid:
    size: 200
    divisions: 20
