# Copy this file to config.yaml and adjust it for your machine.
workspace_root: ~/CAD-Agent-Projects

# ── 1. Active LLM Provider ───────────────────────────────────────────────────
# Supported providers: openrouter | gemini (aistudio) | vertex | openai | ollama
# Set either a provider name ("openrouter") or "<provider>:<model>"
# ("gemini:gemini-3.8-flash"). If only a provider name is given, the first
# model listed under that provider below is used as its default.
llm:
  provider: openrouter
  # Optional backup provider (same forms as `provider`, e.g. "vertex"), used
  # once if the primary fails after its own retries. Must differ from provider.
  fallback_provider: ""
  # Optional limit across providers (Gemini API enforces maxOutputTokens <= 65535).
  # Defaults to 16384 when omitted.
  # max_completion_tokens: 16384

# ── 2. Providers & Per-Model Settings ────────────────────────────────────────
# Each provider groups its own connection settings and models in one place.
# Every model can define its own `reasoning_effort` ("" | none | minimal | low | medium | high | xhigh | max).
# Models configured below appear automatically in the Web UI model picker.
# Optional provider keys (shown values are defaults where applicable):
#   all:        base_url, timeout_seconds, reasoning_effort (default for its models)
#   openrouter: provider_order: [], force_provider: false, reasoning_max_tokens: 4096
#               (defaults for its models; 4096 bounds reasoning so tool calls never truncate, 0 = unlimited),
#               app_title, app_url, session_prefix, enable_anthropic_cache: true, enable_gemini_cache: true
#   gemini:     store: true, project_id / location (auth_mode: gcloud only)

openrouter:
  # In OpenRouter, each model is hosted by different upstream sub-providers.
  # You can bind `providers` (priority routing order), `force_provider`, and
  # `reasoning_effort` directly per model so switching models in the UI
  # automatically switches the OpenRouter sub-providers too:
  # reasoning_max_tokens: 4096   # Default 4096 caps thinking tokens so complex tool calls never truncate (0 = unlimited)
  models: {}
    # deepseek/deepseek-r1:
    #   reasoning_effort: high       # Takes precedence over reasoning_max_tokens when set
    #   providers: [novita/fp8, deepinfra/fp4]
    #   force_provider: false
    # z-ai/glm-5:
    #   reasoning_max_tokens: 2048   # Caps reasoning tokens when reasoning_effort is omitted (0 = unlimited)
    #   providers: [z-ai/fp8]

gemini:
  auth_mode: api_key            # api_key (GEMINI_API_KEY in .env) | gcloud
  models:
    gemini-3.8-flash:
      reasoning_effort: ""
    gemini-4-argon:
      reasoning_effort: ""

vertex:
  project_id: ""                # Auto-detected from gcloud / GCP_PROJECT if blank
  location: us-central1
  models:
    gemini-3.8-flash:
      reasoning_effort: ""
    gemini-4-argon:
      reasoning_effort: ""

ollama:
  base_url: http://localhost:11434/v1
  models:
    qwen3.8:27b:
      reasoning_effort: ""

openai:
  models: {}
    # gpt-5:
    #   reasoning_effort: medium

# ── 3. Agent, Server & Viewport ──────────────────────────────────────────────
agent:
  tool_call_limit: 12
  revision_retention_count: 0   # 0 keeps all model revisions
  # off | errors (<project>/debug-errors.jsonl) | debug (rolling activity.jsonl)
  # | dataset (untrimmed trajectories/<run_id>.jsonl)
  log_mode: off

server:
  host: 127.0.0.1
  port: 8000

ui:
  show_info_messages: true

viewer:
  grid:
    size: 200                   # Square ground grid in mm (X and Z)
    divisions: 20

review:
  render_workers: 4
  required_views: 8

# ── 4. User 3D Printing Setup ────────────────────────────────────────────────
user:
  printer: ""                   # 3D printer / device model (e.g. Bambu Lab A1, Prusa MK4, Ender 3)
  nozzle: "0.4 mm"              # Nozzle type & diameter (e.g. Stainless Steel 0.6 mm, Hardened Steel 0.4 mm, Brass 0.4 mm)
  filament: PLA                 # Favorite filament material (PLA, PETG, ABS, ASA, TPU, etc.)
  additional_info: ""           # Extra instructions / setup notes (e.g. textured PEI sheet, enclosed chamber, custom tolerances)
