# Copy this file to config.yaml and adjust it for your machine.
workspace_root: ~/CAD-Agent-Projects

agent:
  tool_call_limit: 30
  revision_retention_count: 0  # 0 keeps all model revisions

openrouter:
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-3.6-flash
  timeout_seconds: 60
  app_title: Local AI CAD Agent
  app_url: ""
  session_prefix: local-ai-cad-agent
  reasoning_effort: "medium"
  provider: "google-vertex/global"
  force_provider: true
  enable_anthropic_cache: true

server:
  host: 127.0.0.1
  port: 5000

ui:
  show_info_messages: true

# CAD quality observability and verification (feature-flagged rollout).
# Phase 1 (passive run/attempt logging) is on by default; later gates are
# disabled until their UI and verifier work lands.
quality:
  enabled: true
  structured_spec: false
  deterministic_validation: false
  multi_view_review: false
  independent_judge: false
  require_user_acceptance: false
  require_acceptance_before_finalize: false
