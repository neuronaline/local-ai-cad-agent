[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# The ``cad_scripts/*`` modules re-export helpers (``json``, ``sys``, ...) that
# look unused to a static checker but are part of the sandbox entry-point
# surface or sibling-module imports.
"agent/tools/cad_scripts/runner.py" = ["F401", "S102"]
"agent/tools/cad_scripts/screenshot.py" = ["F401", "E402", "S102"]
"agent/cad_review.py" = ["TRY004"]
"agent/dispatcher.py" = ["TRY004"]
"agent/tools/cad_review_tool.py" = ["TRY004"]
"agent/tools/cad_screenshot_tool.py" = ["TRY004"]
"agent/tools/file_tool.py" = ["TRY004"]
"agent/tools/process_runner.py" = ["TRY004"]
"agent/tools/question_tool.py" = ["TRY004"]
# ConversationStore intentionally swallows errors raised while closing
# previous log handles (rotation, cache eviction) — the caller has nothing
# useful to do with such failures and we never want a retry loop.
"agent/conversation.py" = ["BLE001", "S110"]
